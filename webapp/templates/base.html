<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trading Scans{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ url_for('main.index') }}">Trading Scans</a>
      <nav class="nav">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('scanners.scanner_index') }}">Scanner View</a>
        <a href="{{ url_for('stocks.stock_search') }}">Stock View</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer wrap">
    <span>Membership history from scanner_history</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
